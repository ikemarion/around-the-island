name: Godot regression tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-tests:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot 4.7.2
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'godot-4.7.2.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'godot-4.7.2'
          Invoke-WebRequest -Uri 'https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_win64.exe.zip' -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $engine = Join-Path $destination 'Godot_v4.7.2-stable_win64_console.exe'
          if (-not (Test-Path -LiteralPath $engine)) { throw 'Godot console executable is missing' }
          "GODOT=$engine" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify test failure detection
        run: pwsh -NoProfile -File tools/run_tests.ps1 -SelfTest
      - name: Run all local regression suites
        run: pwsh -NoProfile -File tools/run_tests.ps1 -Suite All
      - name: Retain diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-test-results
          path: build/test-results/
          if-no-files-found: ignore
          retention-days: 7
